name: SubtitleStyleProbe
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    tvOS: "18.0"
packages:
  AetherEngine:
    path: ../../AetherEngine
settings:
  base:
    SWIFT_VERSION: 6.0
targets:
  SubtitleStyleProbe:
    type: application
    platform: tvOS
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Subtitle Probe
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneClassName: UIWindowScene
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SubtitleStyleProbeSceneDelegate
    sources:
      - Sources
      - ../../Sources/SyncnextHybrid/HybridSubtitleOverlayView.swift
      - ../../Sources/SyncnextHybrid/HybridSubtitlePresentation.swift
    dependencies:
      - package: AetherEngine
        product: AetherEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qoli.SyncnextSubtitleStyleProbe
        PRODUCT_NAME: SubtitleStyleProbe
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 3
        EXCLUDED_ARCHS[sdk=appletvsimulator*]: x86_64
        GENERATE_INFOPLIST_FILE: NO
schemes:
  SubtitleStyleProbe:
    build:
      targets:
        SubtitleStyleProbe: all
    run:
      config: Debug
