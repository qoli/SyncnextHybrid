name: HybridSmokePlayer
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    tvOS: "18.0"
packages:
  SyncnextHybrid:
    path: ../..
  AetherEngine:
    path: ../../AetherEngine
settings:
  base:
    SWIFT_VERSION: 6.0
targets:
  HybridSmokePlayer:
    type: application
    platform: tvOS
    sources:
      - Sources
    dependencies:
      - package: SyncnextHybrid
        product: SyncnextHybrid
      - package: AetherEngine
        product: AetherEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qoli.SyncnextHybridSmoke
        PRODUCT_NAME: HybridSmokePlayer
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 3
        EXCLUDED_ARCHS[sdk=appletvsimulator*]: x86_64
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
  HybridSmokePlayerTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - Tests
      - ../../Tests/SyncnextHybridTests/HybridOptionalComponentsTests.swift
      - ../../AetherEngine/Tests/AetherEngineTests/APACEncoderTests.swift
      - ../../AetherEngine/Tests/AetherEngineTests/SpatialObjectRenderingTests.swift
      - ../../AetherEngine/Tests/AetherEngineTests/TrueHDObjectMetadataMappingTests.swift
      - ../../AetherEngine/Tests/AetherEngineTests/DTSXObjectMetadataMappingTests.swift
      - ../../AetherEngine/Tests/AetherEngineTests/DualLayerRouteDecisionTests.swift
      - ../../AetherEngine/Tests/AetherEngineTests/DolbyVisionColorTests.swift
    dependencies:
      - target: HybridSmokePlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qoli.SyncnextHybridSmokeTests
        GENERATE_INFOPLIST_FILE: YES
        EXCLUDED_ARCHS[sdk=appletvsimulator*]: x86_64
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TrueHDObjectAudio DTSXObjectAudio DualLayerDolbyVision DolbyVisionStillReshaping
schemes:
  HybridSmokePlayer:
    build:
      targets:
        HybridSmokePlayer: all
        HybridSmokePlayerTests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - HybridSmokePlayerTests
